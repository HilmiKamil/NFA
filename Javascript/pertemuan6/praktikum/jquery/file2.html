<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
    <title>Selector Hirarki</title>
</head>
<body>
    <div>
        <h2>Judul</h2>
        <p>paragraph dalam div</p>
    </div>

    <p>paragraph diluar div</p>

    <button id="ubah">Sorot paragraph didalam div</button>

    <script>
        $(document).ready(function(){
            $("#ubah").click(function(){
                $("div p").css("background", "yellow");
            });
        });
    </script>
    
</body>
</html>
